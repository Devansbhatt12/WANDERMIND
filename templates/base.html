<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Mumbai Explorer{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{
  --saffron:#FF6B00;--saffron-light:#FF8C38;--saffron-dark:#D45500;
  --navy:#0A1628;--navy-mid:#12233F;--navy-soft:#1A3A5C;
  --gold:#F5A623;--cream:#FFF8F0;--sea:#1B6CA8;--sea-light:#3A8EC0;
  --text:#1A1A2E;--muted:#6B7A8D;--white:#FFFFFF;
  --glass:rgba(255,255,255,0.08);--glass-border:rgba(255,255,255,0.15);
  --radius:14px;--shadow:0 8px 32px rgba(10,22,40,0.18);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--white);min-height:100vh;overflow-x:hidden;}
/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(10,22,40,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--glass-border);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-brand .logo{width:36px;height:36px;background:linear-gradient(135deg,var(--saffron),var(--gold));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.nav-brand span{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--white);}
.nav-brand span em{color:var(--saffron);font-style:normal;}
.nav-links{display:flex;gap:4px;align-items:center;}
.nav-links a{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;text-decoration:none;color:rgba(255,255,255,0.7);font-size:13.5px;font-weight:500;transition:all .2s;white-space:nowrap;}
.nav-links a:hover,.nav-links a.active{background:var(--glass);color:var(--white);}
.nav-links a i{font-size:14px;color:var(--saffron);}
.nav-user{display:flex;align-items:center;gap:12px;}
.nav-avatar{width:36px;height:36px;background:linear-gradient(135deg,var(--saffron),var(--gold));border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer;}
.nav-logout{padding:7px 14px;background:rgba(255,107,0,0.15);border:1px solid rgba(255,107,0,0.3);color:var(--saffron);border-radius:8px;font-size:13px;text-decoration:none;transition:all .2s;}
.nav-logout:hover{background:var(--saffron);color:white;}
/* ── MAIN ── */
main{padding-top:64px;min-height:100vh;}
/* ── GLASS CARD ── */
.glass{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);backdrop-filter:blur(12px);}
/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--navy);}::-webkit-scrollbar-thumb{background:var(--saffron);border-radius:3px;}
/* ── BUTTON ── */
.btn{padding:10px 22px;border-radius:10px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:14px;transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:linear-gradient(135deg,var(--saffron),var(--saffron-light));color:white;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,107,0,0.4);}
.btn-ghost{background:var(--glass);border:1px solid var(--glass-border);color:var(--white);}
.btn-ghost:hover{background:rgba(255,255,255,0.12);}
/* ── PAGE HEADER ── */
.page-header{padding:40px 24px 24px;max-width:1200px;margin:0 auto;}
.page-header h1{font-family:'Playfair Display',serif;font-size:36px;font-weight:900;margin-bottom:8px;}
.page-header p{color:rgba(255,255,255,0.6);font-size:16px;}
{% block extra_styles %}{% endblock %}
</style>
</head>
<body>
<nav>
  <a class="nav-brand" href="{{ url_for('home') }}">
    <div class="logo">🌊</div>
    <span>WANDERMIND <em></em></span>
  </a>
  {% if session.get('user') %}
  <div class="nav-links">
    <a href="{{ url_for('home') }}" {% if request.endpoint=='home' %}class="active"{% endif %}><i class="fas fa-home"></i>Home</a>
    <a href="{{ url_for('chatbot') }}" {% if request.endpoint=='chatbot' %}class="active"{% endif %}><i class="fas fa-robot"></i>AI Guide</a>
    <a href="{{ url_for('snap') }}" {% if request.endpoint=='snap' %}class="active"{% endif %}><i class="fas fa-camera"></i>Snap</a>
    <a href="{{ url_for('map_page') }}" {% if request.endpoint=='map_page' %}class="active"{% endif %}><i class="fas fa-map"></i>Map</a>
    <a href="{{ url_for('places') }}" {% if request.endpoint=='places' %}class="active"{% endif %}><i class="fas fa-compass"></i>Places</a>
  </div>
  <div class="nav-user">
    <div class="nav-avatar">{{ session.get('name','U')[0].upper() }}</div>
    <a href="{{ url_for('logout') }}" class="nav-logout"><i class="fas fa-sign-out-alt"></i></a>
  </div>
  {% endif %}
</nav>
<main>{% block content %}{% endblock %}</main>
<script>{% block scripts %}{% endblock %}</script>
</body>
</html>
