<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register — WANDERMIND</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root{--saffron:#FF6B00;--gold:#F5A623;--navy:#0A1628;--glass:rgba(255,255,255,0.07);--glass-border:rgba(255,255,255,0.13);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#0A1628 0%,#1A3A5C 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.card{width:100%;max-width:460px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:20px;backdrop-filter:blur(20px);padding:48px 44px;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:32px;}
.brand .icon{width:44px;height:44px;background:linear-gradient(135deg,var(--saffron),var(--gold));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.brand span{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;}
.brand span em{color:var(--saffron);font-style:normal;}
h2{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;margin-bottom:6px;}
.sub{color:rgba(255,255,255,.5);font-size:14px;margin-bottom:32px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);margin-bottom:6px;}
.form-group .inp-wrap{position:relative;}
.form-group .inp-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.35);font-size:14px;}
.form-group input{width:100%;padding:12px 13px 12px 40px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);border-radius:10px;color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:all .2s;}
.form-group input::placeholder{color:rgba(255,255,255,.3);}
.form-group input:focus{border-color:rgba(255,107,0,.5);background:rgba(255,255,255,.12);}
.btn-submit{width:100%;padding:14px;background:linear-gradient(135deg,var(--saffron),#FF8C38);border:none;border-radius:11px;color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .25s;margin-top:8px;}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,107,0,.45);}
.error{background:rgba(255,80,80,.12);border:1px solid rgba(255,80,80,.3);border-radius:10px;padding:11px 14px;margin-bottom:18px;font-size:13px;color:#ff8080;display:flex;align-items:center;gap:8px;}
.switch{text-align:center;margin-top:22px;color:rgba(255,255,255,.5);font-size:14px;}
.switch a{color:var(--saffron);text-decoration:none;font-weight:600;}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="icon">🌊</div><span>Mumbai<em>Explorer</em></span></div>
  <h2>Join the Journey ✈️</h2>
  <p class="sub">Create your account to explore Mumbai</p>
  {% if error %}<div class="error"><i class="fas fa-exclamation-circle"></i>{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="form-group">
      <label>Full Name</label>
      <div class="inp-wrap"><i class="fas fa-user"></i><input type="text" name="name" placeholder="Your name" required></div>
    </div>
    <div class="form-group">
      <label>Username</label>
      <div class="inp-wrap"><i class="fas fa-at"></i><input type="text" name="username" placeholder="Choose a username" required></div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="inp-wrap"><i class="fas fa-lock"></i><input type="password" name="password" placeholder="Min 6 characters" required></div>
    </div>
    <button type="submit" class="btn-submit">Create Account & Explore 🗺️</button>
  </form>
  <div class="switch">Already have an account? <a href="/login">Sign in</a></div>
</div>
</body>
</html>
